<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>A Score for All of Us - Console</title>
        <link rel="icon" href="data:,">
    </head>
    <body>
        <h1>Console</h1>

        <p id="status">Not connected</p>
        
        <p id="room"></p>
        <button id="start">Start Piece</button>
        <button id="reset">Reset</button>
        
        <p id="voting"></p>
        <label><input type="checkbox" id="override"> Override: use my typed counts 
                                                     instead of the audience's votes
        </label>

        <label>Red <input type="number" id="Red" min="0" value="0"></label>
        <label>Orange <input type="number" id="Orange" min="0" value="0"></label>
        <label>Yellow <input type="number" id="Yellow" min="0" value="0"></label>
        <label>Green <input type="number" id="Green" min="0" value="0"></label>
        <label>Blue <input type="number" id="Blue" min="0" value="0"></label>
        <label>Indigo <input type="number" id="Indigo" min="0" value="0"></label>
        <label>Violet <input type="number" id="Violet" min="0" value="0"></label>

        <button id="next">X: next page</button>
        <label>Page <input type="number" id="pageInput" min="0" value="0"></label>
        <button id="goTo">Go to page</button>

        <script src="config.js"></script>
        <script src="console.js"></script>
    </body>
</html>
